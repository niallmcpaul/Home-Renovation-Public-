<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Renovation Tracker{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header class="topbar">
  {% if user %}
  <nav class="nav">
    <a href="/" class="brand">Reno Tracker</a>
    <a href="/">Dashboard</a>
    <a href="/items">Items</a>
    <a href="/contractors">Contractors</a>
    <a href="/timeline">Timeline</a>
    <a href="/budget">Budget</a>
    <a href="/activity">Activity</a>
    <a href="/settings">Settings</a>
    <form method="post" action="/logout" class="inline-form"><button type="submit" class="link-btn">Logout</button></form>
  </nav>
  <form method="post" action="/quick-add" class="quick-add">
    <input type="text" name="title" placeholder="Quick add a wish… press Enter" autocomplete="off" required>
  </form>
  {% else %}
  <div class="brand">Reno Tracker</div>
  {% endif %}
</header>
{% set msg = request.query_params.get('msg') %}
{% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
